<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Lyrics Now</title>
<style>
  :root { color-scheme: light dark; }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: #0b0b12; color: #f2f2f7; padding: 24px;
  }
  .card { width: 100%; max-width: 420px; text-align: center; }
  h1 { font-size: 1.4rem; margin: 0 0 4px; }
  p.sub { color: #9a9aa8; margin: 0 0 28px; font-size: 0.92rem; }
  button#toggle {
    width: 160px; height: 160px; border-radius: 50%; border: none; cursor: pointer;
    font-size: 1rem; font-weight: 600; color: white;
    background: radial-gradient(circle at 30% 30%, #7c5cff, #4b2fd8);
    box-shadow: 0 0 0 0 rgba(124,92,255,0.6); transition: transform .15s ease;
  }
  button#toggle:active { transform: scale(0.96); }
  button#toggle.listening { animation: pulse 1.6s infinite; background: radial-gradient(circle at 30% 30%, #ff5c8a, #d81b60); }
  @keyframes pulse {
    0% { box-shadow: 0 0 0 0 rgba(216,27,96,0.55); }
    70% { box-shadow: 0 0 0 22px rgba(216,27,96,0); }
    100% { box-shadow: 0 0 0 0 rgba(216,27,96,0); }
  }
  #status { margin-top: 22px; min-height: 44px; font-size: 0.98rem; color: #d6d6e0; white-space: pre-line; }
  #lastSong { margin-top: 6px; font-size: 0.88rem; color: #9a9aa8; }
  .progress {
    margin-top: 14px; height: 6px; border-radius: 3px; background: #1c1c26;
    overflow: hidden; visibility: hidden;
  }
  .progress.active { visibility: visible; }
  .progress-fill {
    height: 100%; width: 0%; border-radius: 3px;
    background: linear-gradient(90deg, #7c5cff, #ff5c8a);
    transition: width 0.2s linear;
  }
</style>
</head>
<body>
<div class="card">
  <h1>Lyrics Now</h1>
  <p class="sub">Tap, let it hear a song, sing along.</p>

  <button id="toggle" disabled>Loading…</button>

  <div id="status">Loading audio engine...</div>
  <div id="lastSong"></div>
  <div class="progress" id="progress"><div class="progress-fill" id="progressFill"></div></div>
</div>

<script type="module">
const PROXY_BASE = 'https://lyrics-now-proxy.utkarshgogna.workers.dev';
const CLIP_MS = 10000;

const toggleBtn = document.getElementById('toggle');
const statusEl = document.getElementById('status');
const lastSongEl = document.getElementById('lastSong');
const progressEl = document.getElementById('progress');
const progressFillEl = document.getElementById('progressFill');

let running = false;
let stream = null;
let lastSongKey = null;
let DecodedSignature = null;

function setStatus(text) { statusEl.textContent = text; }

function pickMimeType() {
  const candidates = ['audio/webm;codecs=opus', 'audio/webm', 'audio/mp4', 'audio/aac', 'audio/ogg;codecs=opus'];
  for (const c of candidates) {
    if (window.MediaRecorder && MediaRecorder.isTypeSupported && MediaRecorder.isTypeSupported(c)) return c;
  }
  return '';
}

function recordClip(mediaStream, durationMs, mimeType) {
  return new Promise((resolve, reject) => {
    let recorder;
    try {
      recorder = mimeType ? new MediaRecorder(mediaStream, { mimeType }) : new MediaRecorder(mediaStream);
    } catch (err) { reject(err); return; }
    const chunks = [];
    recorder.ondataavailable = (e) => { if (e.data && e.data.size > 0) chunks.push(e.data); };
    recorder.onerror = (e) => reject(e.error || new Error('recorder error'));
    recorder.onstop = () => resolve(new Blob(chunks, { type: recorder.mimeType || mimeType || 'audio/webm' }));
    recorder.start();
    setTimeout(() => { if (recorder.state !== 'inactive') recorder.stop(); }, durationMs);
  });
}

async function fingerprintClip(blob) {
  const arrayBuffer = await blob.arrayBuffer();
  const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  const audioBuffer = await audioCtx.decodeAudioData(arrayBuffer);
  const channelData = audioBuffer.getChannelData(0);
  const sig = DecodedSignature.new(channelData, audioBuffer.sampleRate, 1);
  try {
    return { uri: sig.uri, samplems: sig.samplems };
  } finally {
    sig.free();
  }
}

async function recognize(blob) {
  const { uri, samplems } = await fingerprintClip(blob);
  const res = await fetch(`${PROXY_BASE}/shazam`, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ uri, samplems }),
  });
  const data = await res.json();
  const track = data.track;
  if (!track || !track.title) return { title: null };
  return { title: track.title, artist: track.subtitle || 'Unknown' };
}

function geniusHitScore(hit) {
  const t = (hit.title_with_featured || hit.title || '').toLowerCase();
  const artistNames = (hit.artist_names || '').toLowerCase();
  if (t.includes('romaniz') || artistNames.includes('romaniz')) return 0;
  if (t.includes('english translation') || artistNames.includes('english translations')) return 1;
  return 2;
}

async function geniusLookup(title, artist) {
  const q = encodeURIComponent(`${title} ${artist}`);
  const res = await fetch(`${PROXY_BASE}/genius?q=${q}`);
  if (!res.ok) throw new Error('lyrics lookup failed');
  const data = await res.json();
  const hits = ((data.response && data.response.hits) || [])
    .filter(h => h.type === 'song')
    .map(h => h.result);
  if (!hits.length) return null;
  const best = hits.slice().sort((a, b) => geniusHitScore(a) - geniusHitScore(b))[0];
  return best.url;
}

function geniusSearchUrl(title, artist) {
  return `https://genius.com/search?q=${encodeURIComponent(title + ' ' + artist)}`;
}

function startCountdown(durationMs) {
  const start = Date.now();
  progressEl.classList.add('active');
  progressFillEl.style.width = '0%';
  const id = setInterval(() => {
    const elapsed = Date.now() - start;
    const remaining = Math.max(0, Math.ceil((durationMs - elapsed) / 1000));
    progressFillEl.style.width = Math.min(100, (elapsed / durationMs) * 100) + '%';
    setStatus(`Keep the song playing — ${remaining}s`);
  }, 200);
  return () => { clearInterval(id); progressEl.classList.remove('active'); };
}

async function listenLoop() {
  const mimeType = pickMimeType();
  while (running) {
    const stopCountdown = startCountdown(CLIP_MS);
    let blob;
    try {
      blob = await recordClip(stream, CLIP_MS, mimeType);
    } catch (err) {
      stopCountdown();
      setStatus('Recording error: ' + err.message);
      break;
    }
    stopCountdown();
    if (!running) break;

    setStatus('Identifying...');
    let result = null;
    try {
      result = await recognize(blob);
    } catch (err) {
      setStatus('Recognition error: ' + err.message + '\nRetrying...');
      continue;
    }

    if (result && result.title) {
      const songKey = result.title + '|' + result.artist;
      if (songKey !== lastSongKey) {
        lastSongKey = songKey;
        lastSongEl.textContent = `${result.title} — ${result.artist}`;
        setStatus('Found it! Opening lyrics...');

        let url = null;
        try { url = await geniusLookup(result.title, result.artist); }
        catch (err) { /* fall through to search url */ }
        if (!url) url = geniusSearchUrl(result.title, result.artist);

        stopListening();
        window.location.href = url;
        return;
      } else {
        setStatus('Still: ' + result.title + ' — still listening...');
      }
    } else {
      setStatus('No match yet, still listening...');
    }
  }
}

async function startListening() {
  try {
    stream = await navigator.mediaDevices.getUserMedia({ audio: true });
  } catch (err) {
    setStatus('Microphone permission denied or unavailable: ' + err.message);
    return;
  }
  running = true;
  lastSongKey = null;
  toggleBtn.innerHTML = 'Stop';
  toggleBtn.classList.add('listening');
  listenLoop();
}

function stopListening() {
  running = false;
  if (stream) { stream.getTracks().forEach(t => t.stop()); stream = null; }
  toggleBtn.innerHTML = 'Start<br>Listening';
  toggleBtn.classList.remove('listening');
}

toggleBtn.addEventListener('click', () => {
  if (!DecodedSignature) return;
  if (running) stopListening(); else startListening();
});

(async () => {
  try {
    const mod = await import('./vendor/shazamio-core.js');
    await mod.default();
    DecodedSignature = mod.DecodedSignature;
    toggleBtn.disabled = false;
    toggleBtn.innerHTML = 'Start<br>Listening';
    setStatus('Tap the button, then hold your phone/laptop mic toward the music.');
  } catch (err) {
    setStatus('Failed to load audio engine: ' + err.message + '\nTry reloading the page.');
  }
})();
</script>
</body>
</html>
